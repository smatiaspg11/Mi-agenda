<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C6B5A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Mi Agenda</title>
<style>:root{color-scheme:light}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Diseño: una hoja de calendario. Arriba la fecha grande, como una hoja que se arranca; debajo la semana o el mes en una tarjeta, el resumen con un anillo de avance y las tareas como tarjetas con la hora en columna monoespaciada. El botón + abre el formulario desde abajo. */
:root {
  --bg: #EDF2F0;
  --surface: #FFFFFF;
  --ink: #0F1D1A;
  --muted: #566A65;
  --line: #DAE4E0;
  --accent: #0E7A63;
  --accent-ink: #FFFFFF;
  --accent-soft: #D8F0E7;
  --accent-deep: #0A5A49;
  --high: #B5340F;
  --high-soft: #FBE3DA;
  --mid: #8F6200;
  --low: #3F6D8E;
  --dot-alta: #E2552B;
  --dot-media: #E3A400;
  --dot-baja: #6C97B8;
  --shadow: 0 1px 2px rgba(15, 29, 26, .06), 0 10px 28px rgba(15, 29, 26, .07);
  --shadow-sm: 0 1px 2px rgba(15, 29, 26, .06);
  --font-display: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1311;
    --surface: #131E1B;
    --ink: #E7F0ED;
    --muted: #8FA39E;
    --line: #233531;
    --accent: #4FD1B0;
    --accent-ink: #052019;
    --accent-soft: #15352E;
    --accent-deep: #7FE3CA;
    --high: #FF9A73;
    --high-soft: #3A2018;
    --mid: #E8C25C;
    --low: #8DB7D6;
    --dot-alta: #FF8A5C;
    --dot-media: #F0C24B;
    --dot-baja: #8DB7D6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .3);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1311;
  --surface: #131E1B;
  --ink: #E7F0ED;
  --muted: #8FA39E;
  --line: #233531;
  --accent: #4FD1B0;
  --accent-ink: #052019;
  --accent-soft: #15352E;
  --accent-deep: #7FE3CA;
  --high: #FF9A73;
  --high-soft: #3A2018;
  --mid: #E8C25C;
  --low: #8DB7D6;
  --dot-alta: #FF8A5C;
  --dot-media: #F0C24B;
  --dot-baja: #8DB7D6;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .3);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html.lock { overflow: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(120px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 620px; margin: 0 auto; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 14px; }
.btn:disabled { opacity: .6; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { background: none; }
.link { border: 0; background: none; padding: 4px 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.link:hover { color: var(--ink); }

/* Fecha */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.leaf { display: flex; align-items: flex-end; gap: 14px; min-width: 0; }
.leaf-num { font: 700 4.6rem/.82 var(--font-display); letter-spacing: -.04em; color: var(--accent); }
.leaf-txt { display: grid; gap: 3px; justify-items: start; padding-bottom: 3px; min-width: 0; }
.leaf-txt .wd { font: 700 1.4rem/1.1 var(--font-display); letter-spacing: -.01em; }
.leaf-txt .mo { font-size: 13px; font-weight: 500; color: var(--muted); }
.rel { padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-deep); font: 600 11px/1.6 var(--font-body); letter-spacing: .06em; text-transform: uppercase; }

/* Selector de vista */
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); justify-self: start; }
.seg button { border: 0; background: none; padding: 7px 18px; border-radius: 999px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Calendario */
.cal { padding: 10px; }
.nav { width: 32px; height: 40px; border: 0; background: none; font-size: 24px; line-height: 1; color: var(--muted); border-radius: 10px; }
.week { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; align-items: center; gap: 2px; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { display: grid; justify-items: center; gap: 3px; padding: 8px 0 7px; border: 0; border-radius: 14px; background: none; min-width: 0; }
.day .dl { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .06em; }
.day .dn { font: 600 1.15rem/1.2 var(--font-display); }
.day.today .dn { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.day.sel { background: var(--accent); color: var(--accent-ink); }
.day.sel .dl { color: inherit; opacity: .85; }
.day.sel .dn { text-decoration-color: var(--accent-ink); }

.mhead { display: flex; align-items: center; justify-content: space-between; padding-bottom: 6px; }
.mtitle { font: 700 1.1rem var(--font-display); letter-spacing: -.01em; }
.mdow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding-bottom: 4px; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cell { display: grid; grid-template-rows: auto 8px; align-content: center; justify-items: center; gap: 4px; height: 50px; padding: 0; min-width: 0; border: 0; border-radius: 13px; background: none; }
.cell .n { font: 600 .98rem/1 var(--font-display); }
.cell.out { opacity: .4; }
.cell.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.cell.sel { background: var(--accent); color: var(--accent-ink); box-shadow: none; }

.dots { display: flex; align-items: center; justify-content: center; gap: 3px; min-height: 8px; }
.d { display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.d-alta { background: var(--dot-alta); }
.d-media { background: var(--dot-media); }
.d-baja { background: var(--dot-baja); }
.dots b { font: 700 9px/1 var(--font-mono); color: var(--muted); }
.sel .dots .d { background: var(--accent-ink); }
.sel .dots b { color: var(--accent-ink); }

/* Resumen */
.brief { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; padding: 16px; }
.brief.noring { grid-template-columns: minmax(0, 1fr); }
.ringbox { position: relative; width: 60px; height: 60px; }
.ring { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3.6; }
.ring-bg { stroke: var(--line); }
.ring-fg { stroke: var(--accent); stroke-linecap: round; }
@media (prefers-reduced-motion: no-preference) { .ring-fg { transition: stroke-dasharray .3s ease; } }
.ringtxt { position: absolute; inset: 0; display: grid; place-items: center; font: 500 13px var(--font-mono); }
.brief-main { display: grid; gap: 10px; min-width: 0; }
.label { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.brief-text { margin: 0; font-size: 1rem; line-height: 1.5; text-wrap: pretty; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.note { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }

/* Lista */
.sec { margin: 0 0 8px; font: 600 12px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sec:not(:first-child) { margin-top: 20px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: 3.2rem 28px minmax(0, 1fr); gap: 8px; align-items: start; padding: 12px 12px 12px 10px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--stripe, var(--line)); border-radius: 14px; box-shadow: var(--shadow-sm); }
.task.p-alta { --stripe: var(--dot-alta); }
.task.p-media { --stripe: var(--dot-media); }
.task.p-baja { --stripe: var(--dot-baja); }
.task.done { --stripe: var(--line); opacity: .72; }
.when { display: grid; font: 500 14px/1.3 var(--font-mono); font-variant-numeric: tabular-nums; }
.when .end { font-size: 12px; color: var(--muted); }
.when .none { color: var(--muted); }
.check { position: relative; width: 28px; height: 28px; margin: -3px 0 0; }
.check input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.check .box { position: absolute; left: 3px; top: 3px; display: grid; place-items: center; width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 50%; background: var(--surface); pointer-events: none; }
.check input:checked + .box { background: var(--accent); border-color: var(--accent); }
.check input:checked + .box::after { content: ""; width: 5px; height: 10px; margin-top: -2px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.body { min-width: 0; }
.t { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.done .t { text-decoration: line-through; color: var(--muted); }
.meta { margin-top: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; font-size: 12.5px; color: var(--muted); }
.pr-alta { color: var(--high); font-weight: 600; }
.pr-media { color: var(--mid); font-weight: 600; }
.pr-baja { color: var(--low); font-weight: 600; }
.clash { padding: 1px 8px; border-radius: 6px; background: var(--high-soft); color: var(--high); font-weight: 600; }
.gap { justify-self: start; padding: 5px 14px; border: 1px dashed var(--accent); border-radius: 999px; background: var(--accent-soft); color: var(--accent-deep); font: 500 12px var(--font-mono); }
.empty { margin: 0; display: grid; gap: 12px; justify-items: center; padding: 26px 18px; border: 1px dashed var(--line); border-radius: 18px; text-align: center; color: var(--muted); }
.empty p { margin: 0; max-width: 40ch; text-wrap: balance; }
.empty strong { color: var(--ink); font: 700 1.15rem var(--font-display); }

/* Botón + y formulario */
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 15; display: grid; place-items: center; width: 58px; height: 58px; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px rgba(14, 122, 99, .35); }
html.lock .fab { display: none; }
.sheet-wrap { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: rgba(5, 12, 10, .5); }
.sheet { position: relative; display: grid; gap: 12px; width: 100%; max-width: 620px; max-height: 92%; overflow: auto; padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } } }
.grab { justify-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line); }
.sheet input[type="text"] { width: 100%; padding: 13px 14px; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; font-size: 16px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 520px) { .fields { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.field { display: grid; gap: 4px; min-width: 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select { width: 100%; min-width: 0; padding: 10px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; font-size: 16px; font-weight: 400; color: var(--ink); }
.form-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.toast { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(84px, env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 420px; margin: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--ink); color: var(--bg); box-shadow: 0 6px 24px rgba(0, 0, 0, .25); }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 4px; }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="leaf">
      <span class="leaf-num" id="dayNum">1</span>
      <div class="leaf-txt">
        <span class="wd" id="dayName">Hoy</span>
        <span class="mo" id="monthName"></span>
        <span class="rel" id="rel" hidden></span>
      </div>
    </div>
    <button type="button" class="btn quiet" id="todayBtn">Ir a hoy</button>
  </header>

  <div class="seg" role="group" aria-label="Vista del calendario">
    <button type="button" id="vWeek" aria-pressed="true">Semana</button>
    <button type="button" id="vMonth" aria-pressed="false">Mes</button>
  </div>

  <section class="card cal" id="cal" aria-label="Calendario"></section>

  <section class="card brief" id="brief" aria-label="Resumen del día">
    <div class="ringbox" id="ringBox" hidden>
      <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
        <circle class="ring-bg" cx="18" cy="18" r="15.9155"></circle>
        <circle class="ring-fg" id="ringFg" cx="18" cy="18" r="15.9155" style="stroke-dasharray: 0 100"></circle>
      </svg>
      <span class="ringtxt" id="ringTxt"></span>
    </div>
    <div class="brief-main">
      <p class="label">Resumen del día</p>
      <p class="brief-text" id="briefText"></p>
      <div class="actions">
        <button type="button" class="btn" id="pullBtn" hidden>Traer atrasadas a hoy</button>
        <button type="button" class="btn" id="moveBtn" hidden>Pasar al día siguiente</button>
      </div>
    </div>
  </section>

  <div class="note" id="noteEx" hidden>
    <span>Hay tareas de ejemplo en tu agenda.</span>
    <button type="button" class="link" id="clearEx">Quitar ejemplos</button>
  </div>

  <section id="agenda" aria-label="Agenda del día"></section>

  <footer class="note">
    <span>Tus tareas se guardan solo en este dispositivo.</span>
    <button type="button" class="link" id="icsBtn">Agregar al calendario del teléfono</button>
    <button type="button" class="link" id="exportBtn">Guardar copia</button>
    <button type="button" class="link" id="importBtn">Restaurar copia</button>
    <input type="file" id="importIn" accept="application/json,.json" hidden>
  </footer>
</main>

<button type="button" class="fab" id="fab" aria-label="Nueva tarea">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"></path></svg>
</button>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="backdrop" id="backdrop"></div>
  <form class="sheet" id="addForm" autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="formLabel">
    <span class="grab" aria-hidden="true"></span>
    <p class="label" id="formLabel">Nueva tarea</p>
    <input type="text" id="titleIn" aria-labelledby="formLabel" placeholder="Ej: Dentista 16:30" maxlength="120" required>
    <div class="fields">
      <label class="field" for="dateIn">Día<input type="date" id="dateIn"></label>
      <label class="field" for="timeIn">Hora<input type="time" id="timeIn"></label>
      <label class="field" for="durIn">Duración<select id="durIn"></select></label>
      <label class="field" for="prioIn">Prioridad
        <select id="prioIn">
          <option value="alta">Alta</option>
          <option value="media" selected>Media</option>
          <option value="baja">Baja</option>
        </select>
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn primary" id="submitBtn">Agregar</button>
      <button type="button" class="btn quiet" id="cancelBtn">Cancelar</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  var DAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var LETTERS = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
  var MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var PRIO = { alta: 'Alta', media: 'Media', baja: 'Baja' };
  var PRIO_ORD = { alta: 0, media: 1, baja: 2 };
  var DURS = [15, 30, 45, 60, 90, 120, 180, 240];
  var STORE = 'mi-agenda-v1';
  var VIEW_KEY = 'mi-agenda-vista';

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var key = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parseKey = function (k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var addDays = function (k, n) { var d = parseKey(k); d.setDate(d.getDate() + n); return key(d); };
  var mondayOf = function (k) { var d = parseKey(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return key(d); };
  var monthStartOf = function (k) { var d = parseKey(k); d.setDate(1); return key(d); };
  var shiftMonth = function (k, n) { var d = parseKey(k); d.setDate(1); d.setMonth(d.getMonth() + n); return key(d); };
  var todayKey = function () { return key(new Date()); };
  var nowMin = function () { var n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
  var toMin = function (t) { var p = t.split(':'); return Number(p[0]) * 60 + Number(p[1]); };
  var toTime = function (m) { m = Math.min(m, 1440); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  var cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
  var durText = function (m) {
    if (m < 60) return m + ' min';
    var hh = Math.floor(m / 60), r = m % 60;
    return r ? hh + ' h ' + r + ' min' : hh + ' h';
  };

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v == null || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'checked') el.checked = !!v;
        else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    Array.prototype.slice.call(arguments, 2).flat().forEach(function (kid) {
      if (kid == null || kid === false) return;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    });
    return el;
  }

  /* Estado */
  function loadView() {
    try { var v = localStorage.getItem(VIEW_KEY); if (v === 'month' || v === 'week') return v; } catch (e) {}
    return 'week';
  }
  var tasks = [];
  var pendBy = new Map();
  var editingId = null;
  var view = loadView();
  var selected = todayKey();

  function parseTime(s) {

    var hh = m[1] !== undefined ? m[1] : m[3];
    var mm = m[1] !== undefined ? m[2] : '00';
    var rest = (s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length))
      .replace(/\s{2,}/g, ' ').replace(/^[\s,.\-–:]+|[\s,.\-–:]+$/g, '').trim();

    return { time: pad(Number(hh)) + ':' + mm, title: rest };

  /* Archivos: copia de seguridad y calendario del teléfono */
  function download(text, name, type) {
    var blob = new Blob([text], { type: type });
    var a = h('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a);
    a.click();
    a.remove();

  }
  function icsEscape(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  }
  function fold(line) {
    var parts = [];
    while (line.length > 60) { parts.push(line.slice(0, 60)); line = ' ' + line.slice(60); }
    parts.push(line);
    return parts.join('\r\n');
  }
  function buildICS(list) {
    var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Mi Agenda//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
    list.forEach(function (t) {
      var day = t.date.replace(/-/g, '');
      L.push('BEGIN:VEVENT', 'UID:' + t.id + '@mi-agenda', 'DTSTAMP:' + stamp, 'SUMMARY:' + icsEscape(t.title));
      if (t.time) {
        var s = toMin(t.time), e = s + t.dur, endDay = day;
        if (e >= 1440) { endDay = addDays(t.date, 1).replace(/-/g, ''); e -= 1440; }
        L.push('DTSTART:' + day + 'T' + t.time.replace(':', '') + '00',
          'DTEND:' + endDay + 'T' + pad(Math.floor(e / 60)) + pad(e % 60) + '00');
      } else {
        L.push('DTSTART;VALUE=DATE:' + day, 'DTEND;VALUE=DATE:' + addDays(t.date, 1).replace(/-/g, ''));
      }
      L.push('PRIORITY:' + (t.prio === 'alta' ? 1 : t.prio === 'media' ? 5 : 9), 'END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.map(fold).join('\r\n') + '\r\n';
  }

  $('backdrop').addEventListener('click', function () { closeSheet(); });
  $('fab').addEventListener('click', askNew);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheetWrap.hidden) closeSheet(); });
  window.addEventListener('popstate', function () { if (!sheetWrap.hidden) closeSheet(true); });

  $('todayBtn').addEventListener('click', function () { selectDay(todayKey()); });
  $('vWeek').addEventListener('click', function () { setView('week'); });
  $('vMonth').addEventListener('click', function () { setView('month'); });
  $('clearEx').addEventListener('click', clearExamples);
  $('moveBtn').addEventListener('click', function () {
    var list = dayInfo(selected).pend, next = addDays(selected, 1);
    moveAll(list, function () { return { date: next }; },
      list.length + (list.length === 1 ? ' tarea pasó' : ' tareas pasaron') + ' al día siguiente.');
  });
  $('pullBtn').addEventListener('click', function () {
    var list = overdue(), today = todayKey();
    moveAll(list, function () { return { date: today, time: '' }; },
      list.length + (list.length === 1 ? ' tarea atrasada quedó' : ' tareas atrasadas quedaron') + ' en hoy, sin hora.');
  });
  $('icsBtn').addEventListener('click', function () {
    var today = todayKey();
    var list = tasks.filter(function (t) { return !t.done && t.date >= today; });
    if (!list.length) { toast('No hay tareas pendientes para agregar al calendario.'); return; }
    download(buildICS(list), 'mi-agenda.ics', 'text/calendar');
    toast('Abre el archivo descargado para agregar las tareas a tu calendario.');
  });
  $('exportBtn').addEventListener('click', function () {
    download(JSON.stringify({ app: 'mi-agenda', version: 1, tasks: snapshot() }, null, 2), 'mi-agenda-' + todayKey() + '.json', 'application/json');
    toast('Descargué tu copia de seguridad.');
  });
  $('importBtn').addEventListener('click', function () { $('importIn').click(); });
  $('importIn').addEventListener('change', function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = JSON.parse(String(r.result));
        var arr = Array.isArray(data) ? data : data.tasks;
        if (!Array.isArray(arr)) throw new Error('formato');
        var have = new Set(tasks.map(function (t) { return t.id; }));
        var added = 0;
        arr.forEach(function (x) {
          if (!x || typeof x.title !== 'string' || !x.title.trim()) return;
          var id = x.id ? String(x.id) : newId();
          if (have.has(id)) return;
          tasks.push(norm({ id: id, data: function () { return x; } }));
          have.add(id);
          added++;
        });
        commit();
        toast(added ? 'Restauré ' + added + (added === 1 ? ' tarea.' : ' tareas.') : 'Esa copia no tenía tareas nuevas.');
      } catch (e) { toast('No pude leer ese archivo. Elige una copia de Mi Agenda.'); }
    };
    r.readAsText(f);
  });

  /* Arranque */
  load();
  render();
  try {
    var accion = new URLSearchParams(location.search).get('accion');
    if (accion) history.replaceState(null, '', location.pathname);
    if (accion === 'hoy') selectDay(todayKey());
    if (accion === 'nueva') openNew();
  } catch (e) {}
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
